name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  # Manual dry-run exercise: runs every step of the pipeline up to but not
  # including `npm publish`. Lets us verify the build/test/pack path without
  # cutting a real tag and landing in a re-tag cycle to fix a latent bug.
  # See issue #2.
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: "Skip npm publish (verify pipeline only)"

# id-token:write is what npm's Trusted Publishing uses to mint a short-lived
# OIDC credential for the publish — no NPM_TOKEN secret in this repo.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # fetch-depth: 0 so the on-main check below can compute merge-base. A
      # tag push otherwise arrives as a shallow clone with no shared history
      # to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Two release-integrity gates, deliberately the first things that run.
      #
      # `npm publish` ships whatever version package.json holds — the tag is
      # only what triggers the workflow, and nothing downstream reconciles the
      # two. Without these checks a mistagged release runs the entire pipeline
      # (install, typecheck, test, audit, build, provider binaries) and fails
      # at the last step, and a tag on a side branch would publish unmerged
      # code under a legitimate version number. An npm version can never be
      # reused, so both are worth catching in the first ten seconds.
      - name: Verify the tag matches package.json
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match package.json version '$version'." \
                 "Expected tag 'v$version'. Bump package.json in a 'release: prepare' commit, or retag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $version"

      # Runs on every path that can publish, including a workflow_dispatch with
      # dry_run: false — that input is the other way to reach `npm publish`.
      - name: Verify the release commit is on main
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::commit $(git rev-parse --short HEAD) is not an ancestor of origin/main." \
                 "Releases publish from main; merge the branch before tagging."
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is on main"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted Publishing requires npm >= 11.5.1. Node 24 ships npm 11.x
      # natively; using Node 22 + `npm install -g npm@latest` hits a known
      # MODULE_NOT_FOUND bug where the self-upgrade corrupts the running npm.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Print npm version
        run: npm --version

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --timeout 15000

      # Use `bun audit` instead of `npm audit`: bun is the install path here,
      # so no package-lock.json exists. `bun audit` reads bun.lock and hits the
      # same advisory DB as npm.
      - name: Audit dependencies (high+)
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

      # Guard against shipping a tarball without the runtime-loaded SQL files
      # (rc.1 regression). Fails the publish before it mints an OIDC token.
      - name: Verify pack manifest
        run: bun run scripts/verify-pack.ts

      # The Buzz Desktop provider runs on an operator's own machine, where
      # Bun may not be installed, so it ships as a compiled single-file
      # executable per target rather than as a script. Checksums are published
      # with it: this binary receives an agent's nsec, so an operator must be
      # able to verify what they put on their PATH.
      - name: Build buzz-backend-torana (darwin-arm64)
        run: |
          bun build src/provider/buzz-backend-torana.ts \
            --compile --target=bun-darwin-arm64 \
            --outfile dist-provider/darwin-arm64/buzz-backend-torana
      - name: Build buzz-backend-torana (linux-x64)
        run: |
          bun build src/provider/buzz-backend-torana.ts \
            --compile --target=bun-linux-x64 \
            --outfile dist-provider/linux-x64/buzz-backend-torana
      - name: Checksum provider binaries
        run: |
          cd dist-provider
          find . -type f -name 'buzz-backend-torana' -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Upload provider binaries
        uses: actions/upload-artifact@v4
        with:
          name: buzz-backend-torana
          path: dist-provider/
          if-no-files-found: error

      # Compute the npm dist-tag: prerelease versions (anything with a `-`
      # after the version) publish under `rc` so they don't take the `latest`
      # pointer from a stable release. Stable versions publish as `latest`.
      - name: Compute dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing $VERSION under dist-tag: $(grep dist_tag $GITHUB_OUTPUT)"

      # workflow_dispatch dry-run: produce the tarball as a build artifact so
      # a maintainer can inspect it (or feed it to a smoke install) without
      # publishing. Only uploads on manual dispatch.
      - name: Pack tarball (dry-run artifact)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm pack
      - name: Upload tarball artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: torana-tarball
          path: torana-*.tgz
          if-no-files-found: error

      # No NODE_AUTH_TOKEN here — npm uses OIDC via the id-token:write permission
      # above, authenticated against the Trusted Publisher configured on npmjs.com.
      # Skipped on workflow_dispatch when dry_run=true (default for manual runs).
      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.dist_tag }}
